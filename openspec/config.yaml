schema: spec-driven
context: |
  PlanRail is a Japanese web scheduling application.
  Frontend: React, Vite, JavaScript, Firebase Authentication, Cloud Firestore.
  Backend: Python, FastAPI, Mock and Ekispert route providers.
  The frontend performs schedule CRUD directly against user-scoped Firestore paths.
  FastAPI exposes only health and route-search application APIs.
  Keep README for human overview/setup, specs for current product behavior,
  changes for planned behavior, and docs for architecture/operations.

rules:
  specs:
    - Include only behavior verified in the current code or tests.
    - Do not describe planned, unknown, or hackathon-only behavior as current behavior.
  proposal:
    - Identify affected existing capabilities and explicit non-goals.
  tasks:
    - Include proportionate verification for every behavioral change.
